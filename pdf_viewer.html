<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Presentation Hub - Mary Grace Hernandez</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    :root {
      --primary-color: #8c0c10;
      --bg-dark: #1e1e1e;
      --bg-card: #ffffff;
      --text-dark: #222222;
      --text-muted: #666666;
      --accent: #f4b251;
      --border-radius: 12px;
      --transition: all 0.3s ease;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background-color: #f7f9fc;
      color: var(--text-dark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 1rem;
      overflow-x: hidden;
    }

    /* Elegant Presentation Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.8rem;
      background: var(--bg-card);
      padding: 0.8rem 1.2rem;
      border-radius: var(--border-radius);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
      border-left: 4px solid var(--primary-color);
    }

    .header-info h1 {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--primary-color);
    }

    .header-info p {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .actions {
      display: flex;
      gap: 0.6rem;
    }

    .btn {
      background: transparent;
      border: 1.5px solid var(--primary-color);
      color: var(--primary-color);
      padding: 6px 14px;
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: 30px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      transition: var(--transition);
    }

    .btn:hover {
      background: var(--primary-color);
      color: #ffffff;
      transform: translateY(-2px);
      box-shadow: 0 4px 10px rgba(140, 12, 16, 0.2);
    }

    .btn-accent {
      border-color: var(--accent);
      color: #795200;
      background: rgba(244, 178, 81, 0.1);
    }

    .btn-accent:hover {
      background: var(--accent);
      color: #000;
      box-shadow: 0 4px 10px rgba(244, 178, 81, 0.3);
    }

    /* Container layout */
    .viewer-container {
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      position: relative;
      background: var(--bg-card);
      border-radius: var(--border-radius);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
      overflow: auto;
      border: 1px solid #e1e8ed;
      min-height: 400px;
    }

    .pdf-canvas-container {
      display: flex;
      justify-content: center;
      align-items: center;
      flex: 1;
      padding: 2rem;
      background: #f9f9f9;
    }

    #pdfCanvas {
      max-width: 100%;
      height: auto;
      border-radius: 4px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    .pdf-controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 1rem;
      padding: 1.5rem;
      border-top: 1px solid #e1e8ed;
      background: #fafafa;
      flex-wrap: wrap;
    }

    .pdf-page-info {
      font-size: 0.9rem;
      color: var(--text-muted);
      min-width: 150px;
      text-align: center;
    }

    .control-btn {
      background: var(--primary-color);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: var(--transition);
    }

    .control-btn:hover {
      background: var(--primary-color);
      transform: translateY(-1px);
      box-shadow: 0 4px 8px rgba(140, 12, 16, 0.2);
    }

    .control-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Fallback UI if PDF cannot render */
    .pdf-fallback {
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 3rem;
      text-align: center;
      height: 100%;
    }

    .pdf-fallback.show {
      display: flex;
    }

    .pdf-fallback i {
      font-size: 3rem;
      color: var(--primary-color);
      margin-bottom: 1rem;
    }

    .pdf-fallback h3 {
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .pdf-fallback p {
      color: var(--text-muted);
      max-width: 320px;
      margin-bottom: 1.5rem;
      font-size: 0.9rem;
    }

    @media (max-width: 600px) {
      .header {
        flex-direction: column;
        align-items: flex-start;
        gap: 0.8rem;
      }
      .actions {
        width: 100%;
        justify-content: space-between;
      }
      .pdf-controls {
        flex-direction: column;
        gap: 0.5rem;
      }
    }
  </style>
</head>
<body>

  <header class="header">
    <div class="header-info">
      <h1 id="doc-title">Presentation Slides</h1>
      <p id="doc-desc">Canva Project Presentation</p>
    </div>
    <div class="actions">
      <button class="btn btn-accent" onclick="togglePresentation()">
        <i class="bi bi-arrow-left-right"></i> Switch Slide
      </button>
      <a href="#" class="btn" id="downloadBtn" download>
        <i class="bi bi-download"></i> Download PDF
      </a>
    </div>
  </header>

  <main class="viewer-container">
    <div class="pdf-canvas-container">
      <canvas id="pdfCanvas"></canvas>
    </div>
    
    <div class="pdf-controls">
      <button class="control-btn" onclick="previousPage()" id="prevBtn">
        <i class="bi bi-chevron-left"></i> Previous
      </button>
      <div class="pdf-page-info">
        <span id="pageNum">1</span> / <span id="pageCount">1</span>
      </div>
      <button class="control-btn" onclick="nextPage()" id="nextBtn">
        Next <i class="bi bi-chevron-right"></i>
      </button>
    </div>

    <div class="pdf-fallback" id="fallback">
      <i class="bi bi-file-earmark-pdf"></i>
      <h3>Cannot Load PDF?</h3>
      <p>There was an issue loading the PDF. You can download it directly to view on your device.</p>
      <a href="#" class="btn" id="fallbackDownloadBtn" download>
        <i class="bi bi-download"></i> Download Presentation
      </a>
    </div>
  </main>

  <script>
    // Set up PDF.js
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    // Project PDF Configurations
    const docs = {
      data: {
        title: "Data Analyst Portfolio Presentation",
        desc: "Showcase of analysis tools, charts, and business intelligence techniques.",
        file: "DataAnalystCanva.pdf"
      },
      voice: {
        title: "Voice Detector AI Presentation",
        desc: "Neural network designs and audio processing metrics for voice detection.",
        file: "VoiceDetectorCanva.pdf"
      }
    };

    let currentDocKey = "data";
    let pdfDoc = null;
    let pageNum = 1;
    let pageCount = 1;
    let isLoading = false;

    async function init() {
      // Check query parameter
      const urlParams = new URLSearchParams(window.location.search);
      const fileParam = urlParams.get('file');

      if (fileParam && docs[fileParam]) {
        currentDocKey = fileParam;
      }

      loadDocument(currentDocKey);
    }

    async function loadDocument(key) {
      currentDocKey = key;
      const doc = docs[key];

      document.getElementById('doc-title').textContent = doc.title;
      document.getElementById('doc-desc').textContent = doc.desc;

      const pdfPath = doc.file;
      document.getElementById('downloadBtn').href = pdfPath;
      document.getElementById('fallbackDownloadBtn').href = pdfPath;

      try {
        isLoading = true;
        pdfDoc = await pdfjsLib.getDocument(pdfPath).promise;
        pageCount = pdfDoc.numPages;
        pageNum = 1;
        updatePageInfo();
        renderPage(pageNum);
        document.getElementById('fallback').classList.remove('show');
      } catch (error) {
        console.error('Error loading PDF:', error);
        showFallback();
      }
    }

    async function renderPage(num) {
      if (!pdfDoc || isLoading) return;

      try {
        isLoading = true;
        const page = await pdfDoc.getPage(num);
        const viewport = page.getViewport({ scale: 2 });
        const canvas = document.getElementById('pdfCanvas');
        const context = canvas.getContext('2d');

        canvas.width = viewport.width;
        canvas.height = viewport.height;

        const renderContext = {
          canvasContext: context,
          viewport: viewport
        };

        await page.render(renderContext).promise;
        updatePageInfo();
      } catch (error) {
        console.error('Error rendering page:', error);
        showFallback();
      } finally {
        isLoading = false;
      }
    }

    function updatePageInfo() {
      document.getElementById('pageNum').textContent = pageNum;
      document.getElementById('pageCount').textContent = pageCount;
      document.getElementById('prevBtn').disabled = pageNum <= 1;
      document.getElementById('nextBtn').disabled = pageNum >= pageCount;
    }

    function nextPage() {
      if (pageNum < pageCount) {
        pageNum++;
        renderPage(pageNum);
      }
    }

    function previousPage() {
      if (pageNum > 1) {
        pageNum--;
        renderPage(pageNum);
      }
    }

    function togglePresentation() {
      const nextKey = currentDocKey === "data" ? "voice" : "data";

      // Update URL query parameters silently
      const newUrl = window.location.pathname + "?file=" + nextKey;
      window.history.pushState({ path: newUrl }, '', newUrl);

      loadDocument(nextKey);
    }

    function showFallback() {
      document.getElementById('fallback').classList.add('show');
      isLoading = false;
    }

    window.onload = init;
  </script>
</body>
</html>
