<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hotel Reservation Simulator - Java Project</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    :root {
      --primary: #0d6efd;
      --secondary: #6c757d;
      --success: #198754;
      --danger: #dc3545;
      --warning: #ffc107;
      --info: #0dcaf0;
      --dark: #212529;
      --light: #f8f9fa;
      --card-bg: #ffffff;
      
      --luxury-maroon: #8c0c10;
      --luxury-gold: #f4b251;
      
      --border-radius: 12px;
      --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background-color: #f3f5f8;
      color: #333333;
      padding: 1rem;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      width: 100%;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    /* Top Bar */
    .top-bar {
      background: linear-gradient(135deg, var(--luxury-maroon) 0%, #5d080b 100%);
      color: #ffffff;
      padding: 1.2rem 1.5rem;
      border-radius: var(--border-radius);
      box-shadow: 0 4px 20px rgba(140, 12, 16, 0.15);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 3px solid var(--luxury-gold);
    }

    .top-bar h1 {
      font-size: 1.4rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
      letter-spacing: 0.5px;
    }

    .top-bar h1 i {
      color: var(--luxury-gold);
    }

    .badge-java {
      background: rgba(244, 178, 81, 0.2);
      border: 1px solid var(--luxury-gold);
      color: var(--luxury-gold);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: bold;
      letter-spacing: 0.5px;
    }

    /* Main Console Grid */
    .console-layout {
      display: grid;
      grid-template-columns: 240px 1fr;
      gap: 1rem;
      flex-grow: 1;
    }

    /* Sidebar Navigation */
    .nav-card {
      background: var(--card-bg);
      border-radius: var(--border-radius);
      padding: 1rem;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.04);
      border: 1px solid #e2e8f0;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .nav-btn {
      background: transparent;
      border: none;
      color: #555;
      text-align: left;
      padding: 12px 16px;
      border-radius: 8px;
      font-family: 'Outfit', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: var(--transition);
    }

    .nav-btn:hover {
      background: #f1f5f9;
      color: var(--luxury-maroon);
    }

    .nav-btn.active {
      background: rgba(140, 12, 16, 0.08);
      color: var(--luxury-maroon);
      border-left: 4px solid var(--luxury-maroon);
      border-radius: 0 8px 8px 0;
      padding-left: 12px;
    }

    .nav-btn i {
      font-size: 1.1rem;
    }

    /* Content Area */
    .content-card {
      background: var(--card-bg);
      border-radius: var(--border-radius);
      padding: 1.5rem;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.04);
      border: 1px solid #e2e8f0;
      display: flex;
      flex-direction: column;
      min-height: 380px;
    }

    .section-title {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 1.2rem;
      color: #2d3748;
      border-bottom: 2px solid #edf2f7;
      padding-bottom: 0.5rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Form Fields */
    .form-group {
      margin-bottom: 1rem;
    }

    .form-label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.9rem;
      font-weight: 600;
      color: #4a5568;
    }

    .form-input {
      width: 100%;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid #cbd5e0;
      font-family: 'Outfit', sans-serif;
      font-size: 0.95rem;
      outline: none;
      transition: var(--transition);
    }

    .form-input:focus {
      border-color: var(--luxury-maroon);
      box-shadow: 0 0 0 3px rgba(140, 12, 16, 0.15);
    }

    /* Grid of choices */
    .checkbox-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 5px;
    }

    .checkbox-item {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #f8fafc;
      padding: 12px 15px;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
      cursor: pointer;
      font-weight: 500;
      font-size: 0.9rem;
      transition: var(--transition);
    }

    .checkbox-item input {
      width: 16px;
      height: 16px;
      accent-color: var(--luxury-maroon);
    }

    .checkbox-item:hover {
      border-color: #cbd5e0;
      background: #f1f5f9;
    }

    .checkbox-item.checked {
      background: rgba(140, 12, 16, 0.04);
      border-color: var(--luxury-maroon);
    }

    /* Room Picker Layout */
    .room-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      margin-top: 8px;
    }

    .room-box {
      border: 1px solid #cbd5e0;
      border-radius: 8px;
      padding: 12px 8px;
      text-align: center;
      cursor: pointer;
      transition: var(--transition);
      background: #f8fafc;
    }

    .room-box h4 {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .room-box p {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .room-box span {
      display: inline-block;
      font-size: 0.65rem;
      padding: 2px 6px;
      border-radius: 12px;
      font-weight: bold;
      background: #e2e8f0;
      color: #4a5568;
    }

    .room-box:hover:not(.occupied) {
      border-color: var(--luxury-maroon);
      background: rgba(140, 12, 16, 0.03);
    }

    .room-box.selected {
      border-color: var(--luxury-maroon);
      background: rgba(140, 12, 16, 0.08);
      box-shadow: 0 0 0 2px var(--luxury-maroon);
    }

    .room-box.selected span {
      background: var(--luxury-maroon);
      color: #ffffff;
    }

    .room-box.occupied {
      background: #fee2e2;
      border-color: #fca5a5;
      cursor: not-allowed;
    }

    .room-box.occupied span {
      background: #ef4444;
      color: #ffffff;
    }

    /* Custom Buttons */
    .btn-submit {
      background: var(--luxury-maroon);
      color: #ffffff;
      border: none;
      padding: 12px 24px;
      border-radius: 30px;
      font-family: 'Outfit', sans-serif;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 1.5rem;
      width: 100%;
      box-shadow: 0 4px 15px rgba(140, 12, 16, 0.2);
      transition: var(--transition);
    }

    .btn-submit:hover {
      background: #730a0d;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(140, 12, 16, 0.3);
    }

    .btn-submit:active {
      transform: translateY(0);
    }

    /* Receipt Style */
    .receipt {
      background: #fffff8;
      border: 2px dashed #cbd5e0;
      padding: 1.5rem;
      border-radius: 8px;
      font-family: monospace;
      color: #1a1a1a;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.02);
      margin-top: 1rem;
      position: relative;
    }

    .receipt-header {
      text-align: center;
      border-bottom: 1px dashed #cbd5e0;
      padding-bottom: 10px;
      margin-bottom: 15px;
    }

    .receipt-title {
      font-weight: bold;
      font-size: 1.1rem;
      letter-spacing: 1px;
    }

    .receipt-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 0.9rem;
    }

    .receipt-total {
      border-top: 1px dashed #cbd5e0;
      margin-top: 12px;
      padding-top: 10px;
      font-weight: bold;
      font-size: 1.1rem;
      color: var(--luxury-maroon);
    }

    /* Customer Table View */
    .table-container {
      overflow-x: auto;
      flex-grow: 1;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.9rem;
    }

    th, td {
      padding: 12px 15px;
      border-bottom: 1px solid #edf2f7;
    }

    th {
      background: #f8fafc;
      font-weight: 700;
      color: #4a5568;
    }

    tr:hover {
      background: #f8fafc;
    }

    .badge-paid {
      background: #dcfce7;
      color: #15803d;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    /* Modal / Alert Dialog mockup */
    .dialog-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.4);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 100;
      animation: fadeIn 0.2s ease-out;
    }

    .dialog-box {
      background: white;
      border-radius: var(--border-radius);
      width: 320px;
      padding: 1.5rem;
      box-shadow: 0 10px 25px rgba(0,0,0,0.25);
      border-top: 4px solid var(--luxury-maroon);
      text-align: center;
      animation: scaleIn 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .dialog-box h3 {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .dialog-box p {
      font-size: 0.9rem;
      color: #555;
      margin-bottom: 1.2rem;
      line-height: 1.4;
    }

    .dialog-btn {
      background: var(--luxury-maroon);
      color: white;
      border: none;
      padding: 8px 24px;
      border-radius: 20px;
      font-weight: 600;
      cursor: pointer;
    }

    /* Tab Panes */
    .tab-pane {
      display: none;
    }

    .tab-pane.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes scaleIn {
      from { transform: scale(0.9); }
      to { transform: scale(1); }
    }

    @media (max-width: 768px) {
      .console-layout {
        grid-template-columns: 1fr;
      }
      .checkbox-grid {
        grid-template-columns: 1fr;
      }
      .room-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <header class="top-bar">
      <h1><i class="bi bi-bank"></i> Royal Palace Hotel Console</h1>
      <span class="badge-java"><i class="bi bi-code-slash"></i> HotelSystem.class</span>
    </header>

    <main class="console-layout">
      <!-- Navigation Tabs Sidebar -->
      <nav class="nav-card">
        <button class="nav-btn active" data-tab="add-booking" type="button">
          <i class="bi bi-person-plus-fill"></i> Add Booking
        </button>
        <button class="nav-btn" data-tab="bookings-directory" type="button">
          <i class="bi bi-journal-text"></i> Bookings List
        </button>
        <button class="nav-btn" data-tab="room-map" type="button">
          <i class="bi bi-grid-3x3-gap-fill"></i> Room Status Map
        </button>
      </nav>

      <!-- Content Panes -->
      <div class="content-card">
        <!-- TAB 1: Add Booking Form -->
        <section id="tab-add-booking" class="tab-pane active">
          <div class="section-title">
            <i class="bi bi-person-plus-fill" style="color: var(--luxury-maroon);"></i> Create New Reservation
          </div>

          <div class="form-group">
            <label class="form-label">Guest Name</label>
            <input type="text" id="guestName" class="form-input" placeholder="e.g. John Doe">
          </div>

          <div class="form-group">
            <label class="form-label">Contact Number</label>
            <input type="tel" id="contactNum" class="form-input" placeholder="e.g. +66 8XXXX-XXXX">
          </div>

          <div class="form-group">
            <label class="form-label">Check-in Date</label>
            <input type="date" id="checkInDate" class="form-input">
          </div>

          <div class="form-group">
            <label class="form-label">Check-out Date</label>
            <input type="date" id="checkOutDate" class="form-input">
          </div>

          <div class="form-group">
            <label class="form-label">Select Room</label>
            <div class="room-grid" id="roomGrid"></div>
          </div>

          <div class="form-group">
            <label class="form-label">Necessities / Add-ons</label>
            <div class="checkbox-grid">
              <label class="checkbox-item">
                <input type="checkbox" value="breakfast" class="necessity-check"> Early Breakfast
              </label>
              <label class="checkbox-item">
                <input type="checkbox" value="laundry" class="necessity-check"> Laundry Service
              </label>
              <label class="checkbox-item">
                <input type="checkbox" value="spa" class="necessity-check"> Spa Access
              </label>
              <label class="checkbox-item">
                <input type="checkbox" value="parking" class="necessity-check"> Parking Space
              </label>
            </div>
          </div>

          <button class="btn-submit" onclick="submitBooking()">
            <i class="bi bi-check-circle"></i> Confirm Booking
          </button>
          <div id="receipt-placeholder"></div>
        </section>

        <!-- TAB 2: Bookings Directory -->
        <section id="tab-bookings-directory" class="tab-pane">
          <div class="section-title">
            <i class="bi bi-journal-text" style="color: var(--luxury-maroon);"></i> All Reservations
          </div>
          <div class="table-container">
            <table id="bookingsTable">
              <thead>
                <tr>
                  <th>Guest Name</th>
                  <th>Room</th>
                  <th>Check-in</th>
                  <th>Check-out</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody id="bookings-list">
                <tr>
                  <td colspan="5" style="text-align: center; color: #999;">No bookings yet</td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>

        <!-- TAB 3: Room Map -->
        <section id="tab-room-map" class="tab-pane">
          <div class="section-title">
            <i class="bi bi-grid-3x3-gap-fill" style="color: var(--luxury-maroon);"></i> Room Availability Map
          </div>
          <div class="room-grid" id="roomMapGrid"></div>
        </section>
      </div>
    </main>
  </div>

  <!-- Dialog Modal -->
  <div class="dialog-overlay" id="dialogOverlay">
    <div class="dialog-box">
      <h3 id="dialogTitle">Message</h3>
      <p id="dialogMsg">Dialog message here</p>
      <button class="dialog-btn" onclick="closeDialog()">OK</button>
    </div>
  </div>

  <script>
    // Initialize tabs with event listeners
    document.querySelectorAll('[data-tab]').forEach(button => {
      button.addEventListener('click', function() {
        const tabName = this.getAttribute('data-tab');
        showTab(tabName, this);
      });
    });

    function showTab(tabId, el) {
      playBeep(800, 0.05);
      
      // Remove active from all buttons
      document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
      el.classList.add('active');

      // Hide all panes
      document.querySelectorAll('.tab-pane').forEach(pane => pane.classList.remove('active'));
      // Show selected pane
      document.getElementById(`tab-${tabId}`).classList.add('active');
    }

    function showJavaDialog(title, text) {
      document.getElementById('dialogTitle').textContent = title;
      document.getElementById('dialogMsg').innerText = text;
      document.getElementById('dialogOverlay').style.display = 'flex';
    }

    function closeDialog() {
      playBeep(350, 0.06);
      document.getElementById('dialogOverlay').style.display = 'none';
    }

    function getAudioCtx() {
      return new (window.AudioContext || window.webkitAudioContext)();
    }

    function playBeep(freq, dur) {
      try {
        const ctx = getAudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.frequency.setValueAtTime(freq, ctx.currentTime);
        gain.gain.setValueAtTime(0.04, ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.001, ctx.currentTime + dur);
        osc.start();
        osc.stop(ctx.currentTime + dur);
      } catch(e){}
    }

    function submitBooking() {
      const name = document.getElementById('guestName').value;
      const checkIn = document.getElementById('checkInDate').value;
      const checkOut = document.getElementById('checkOutDate').value;

      if (!name || !checkIn || !checkOut) {
        showJavaDialog('Validation Error', 'Please fill in all required fields.');
        return;
      }

      showJavaDialog('Success', `Booking confirmed for ${name}!\nCheck-in: ${checkIn}\nCheck-out: ${checkOut}`);
      playBeep(523.25, 0.1);
      
      // Clear form
      document.getElementById('guestName').value = '';
      document.getElementById('contactNum').value = '';
      document.getElementById('checkInDate').value = '';
      document.getElementById('checkOutDate').value = '';
    }

    function initRooms() {
      const roomGrid = document.getElementById('roomGrid');
      roomGrid.innerHTML = '';
      for (let i = 1; i <= 20; i++) {
        const room = document.createElement('div');
        room.className = 'room-box';
        room.innerHTML = `<h4>Room ${i}</h4><p>Standard</p><span>Available</span>`;
        room.addEventListener('click', function() {
          document.querySelectorAll('.room-box').forEach(r => r.classList.remove('selected'));
          this.classList.add('selected');
        });
        roomGrid.appendChild(room);
      }
    }

    window.onload = () => {
      initRooms();
    };
  </script>
</body>
</html>
