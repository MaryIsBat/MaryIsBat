<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Presentation Hub - Mary Grace Hernandez</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    :root {
      --primary-color: #8c0c10;
      --bg-dark: #1e1e1e;
      --bg-card: #ffffff;
      --text-dark: #222222;
      --text-muted: #666666;
      --accent: #f4b251;
      --border-radius: 12px;
      --transition: all 0.3s ease;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background-color: #f7f9fc;
      color: var(--text-dark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 1rem;
      overflow-x: hidden;
    }

    /* Elegant Presentation Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.8rem;
      background: var(--bg-card);
      padding: 0.8rem 1.2rem;
      border-radius: var(--border-radius);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
      border-left: 4px solid var(--primary-color);
    }

    .header-info h1 {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--primary-color);
    }

    .header-info p {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .actions {
      display: flex;
      gap: 0.6rem;
    }

    .btn {
      background: transparent;
      border: 1.5px solid var(--primary-color);
      color: var(--primary-color);
      padding: 6px 14px;
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: 30px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      transition: var(--transition);
    }

    .btn:hover {
      background: var(--primary-color);
      color: #ffffff;
      transform: translateY(-2px);
      box-shadow: 0 4px 10px rgba(140, 12, 16, 0.2);
    }

    .btn-accent {
      border-color: var(--accent);
      color: #795200;
      background: rgba(244, 178, 81, 0.1);
    }

    .btn-accent:hover {
      background: var(--accent);
      color: #000;
      box-shadow: 0 4px 10px rgba(244, 178, 81, 0.3);
    }

    /* Container layout */
    .viewer-container {
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      position: relative;
      background: var(--bg-card);
      border-radius: var(--border-radius);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
      overflow: hidden;
      border: 1px solid #e1e8ed;
      min-height: 250px;
    }

    .pdf-frame {
      width: 100%;
      height: 100%;
      flex-grow: 1;
      border: none;
    }

    /* Fallback UI if PDF cannot render */
    .pdf-fallback {
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 3rem;
      text-align: center;
      height: 100%;
    }

    .pdf-fallback i {
      font-size: 3rem;
      color: var(--primary-color);
      margin-bottom: 1rem;
    }

    .pdf-fallback h3 {
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .pdf-fallback p {
      color: var(--text-muted);
      max-width: 320px;
      margin-bottom: 1.5rem;
      font-size: 0.9rem;
    }

    @media (max-width: 600px) {
      .header {
        flex-direction: column;
        align-items: flex-start;
        gap: 0.8rem;
      }
      .actions {
        width: 100%;
        justify-content: space-between;
      }
    }
  </style>
</head>
<body>

  <header class="header">
    <div class="header-info">
      <h1 id="doc-title">Presentation Slides</h1>
      <p id="doc-desc">Canva Project Presentation</p>
    </div>
    <div class="actions">
      <button class="btn btn-accent" id="toggleBtn" onclick="togglePresentation()">
        <i class="bi bi-arrow-left-right"></i> Switch Slide
      </button>
      <a href="#" class="btn" id="downloadBtn" download>
        <i class="bi bi-download"></i> Download PDF
      </a>
    </div>
  </header>

  <main class="viewer-container">
    <iframe src="" class="pdf-frame" id="pdfViewer" aria-label="PDF Viewer"></iframe>
    <div class="pdf-fallback" id="fallback">
      <i class="bi bi-file-earmark-pdf"></i>
      <h3>Cannot Load PDF Viewer?</h3>
      <p>Your browser or device might not support inline PDF viewing. You can download the full PDF to view it on your device.</p>
      <a href="#" class="btn" id="fallbackDownloadBtn" download>
        <i class="bi bi-download"></i> Download Presentation
      </a>
    </div>
  </main>

  <script>
    // Project PDF Configurations
    const docs = {
      data: {
        title: "Data Analyst Portfolio Presentation",
        desc: "Showcase of analysis tools, charts, and business intelligence techniques.",
        file: "DataAnalystCanva.pdf"
      },
      voice: {
        title: "Voice Detector AI Presentation",
        desc: "Neural network designs and audio processing metrics for voice detection.",
        file: "VoiceDetectorCanva.pdf"
      }
    };

    let currentDocKey = "data";

    function init() {
      // Check query parameter
      const urlParams = new URLSearchParams(window.location.search);
      const fileParam = urlParams.get('file');
      
      if (fileParam && docs[fileParam]) {
        currentDocKey = fileParam;
      }
      
      loadDocument(currentDocKey);
    }

    function loadDocument(key) {
      currentDocKey = key;
      const doc = docs[key];
      
      document.getElementById('doc-title').textContent = doc.title;
      document.getElementById('doc-desc').textContent = doc.desc;
      
      const pdfPath = doc.file;
      const pdfViewer = document.getElementById('pdfViewer');
      
      pdfViewer.src = pdfPath;
      document.getElementById('downloadBtn').href = pdfPath;
      document.getElementById('fallbackDownloadBtn').href = pdfPath;

      // Simple detection for potential loading errors (e.g. on devices without native viewer)
      pdfViewer.onerror = function() {
        pdfViewer.style.display = 'none';
        document.getElementById('fallback').style.display = 'flex';
      };
    }

    function togglePresentation() {
      const nextKey = currentDocKey === "data" ? "voice" : "data";
      
      // Update URL query parameters silently
      const newUrl = window.location.pathname + "?file=" + nextKey;
      window.history.pushState({ path: newUrl }, '', newUrl);
      
      loadDocument(nextKey);
      
      // Try to play parent's tab change sound if accessible
      try {
        if (window.parent && typeof window.parent.playTabSound === 'function') {
          window.parent.playTabSound();
        }
      } catch (e) {}
    }

    window.onload = init;
  </script>
</body>
</html>
